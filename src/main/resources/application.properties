spring.application.name=volunteer-management

# Real secrets live in secrets.properties (git-ignored) or in environment variables - see secrets.properties.example
spring.config.import=optional:classpath:secrets.properties,optional:file:./secrets.properties

spring.datasource.url=jdbc:mysql://localhost:3306/community_service
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Email notifications (sent when a volunteer is assigned to an event). Leave MAIL_USERNAME empty to disable.
# Optional HTTPS email (use on hosts that block SMTP, e.g. Render free): BREVO_API_KEY and MAIL_FROM
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Security (JWT). The app refuses to start if JWT_SECRET is missing.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Default ADMIN account, created on first startup only when no ADMIN exists
app.admin.name=Administrator
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# Address of the website, used to build the link in password reset emails
# (set APP_BASE_URL to your real address, for example https://volunteers.example.org)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Google sign-in (optional). Leave empty to switch it off.
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Always re-check the web page files (html/js/css) so a browser never shows an old cached copy
spring.web.resources.cache.cachecontrol.no-cache=true

# Also write the application log to a file (so email and error messages can be read after the fact)
logging.file.name=logs/volunteer-management.log

# Profile photos: the app itself accepts up to 2 MB (a little headroom here for the upload envelope)
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
