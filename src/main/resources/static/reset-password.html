<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- the reset token is in this page's address, so never pass the address on to other sites -->
  <meta name="referrer" content="no-referrer">
  <title>Reset password – Community Volunteer Management System</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body class="auth-body">

  <main class="auth-wrap">
    <div class="auth-brand">
      <img class="auth-logo" src="logo.png" alt="Community Volunteer Management System logo">
      <h1>Community Volunteer Management System</h1>
      <p>Choose a new password for your account.</p>
    </div>

    <div class="card auth-card">
      <div id="reset-message" class="message hidden" role="alert"></div>

      <!-- shown when the link is missing, invalid, used or expired -->
      <div id="invalid-box" class="hidden">
        <h2 class="auth-title">This link cannot be used</h2>
        <p class="muted">Reset links work once and expire after 30 minutes. Request a new one and try again.</p>
        <a class="btn btn-primary btn-block" href="login.html?forgot=1">Request a new link</a>
      </div>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="new-password">New password (min 8 characters)</label>
          <input type="password" id="new-password" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="confirm-password">Repeat new password</label>
          <input type="password" id="confirm-password" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="reset-btn">Reset password</button>
        <p class="auth-link"><a href="login.html">Back to login</a></p>
      </form>
    </div>
  </main>

  <script src="password-toggle.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
